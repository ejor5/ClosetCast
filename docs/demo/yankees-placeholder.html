<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yankees demo stream</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", "Segoe UI", Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #fff8df;
        background:
          radial-gradient(circle at 30% 20%, rgba(185, 71, 54, 0.35), transparent 40%),
          linear-gradient(160deg, #1a100c, #050505 70%);
      }

      .panel {
        text-align: center;
        padding: 2rem;
      }

      .eyebrow {
        margin: 0 0 0.5rem;
        color: #f4c95d;
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 5vw, 3rem);
      }

      p {
        margin: 0;
        color: #d6c59b;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <p class="eyebrow">ClosetCast demo</p>
      <h1>Yankees stream placeholder</h1>
      <p>Live stream sites are not embedded here. In the real app, ClosetCast loads your configured game page.</p>
    </div>
  </body>
</html>
